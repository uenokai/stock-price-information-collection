# 週次ファンダメンタル・スクリーニング + バックテスト
# 毎週土曜 07:00 JST (金曜 22:00 UTC) に全ユニバースをスクリーニングし、
# ウォッチリストとレポートをリポジトリにコミットする。
# 続けて新しいウォッチリストでシグナルルールのバックテストを行い reports/backtest.md を更新する。
name: Weekly Screening

on:
  schedule:
    - cron: "0 22 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: screener-data
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      - name: Run screening
        run: stock-screener screen

      - name: Run backtest on the new watchlist
        run: stock-screener backtest

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 先にコミットしてから pull --rebase する (未コミットの変更があると rebase が失敗するため)
          git add data reports
          if git diff --cached --quiet; then
            echo "変更なし: コミットをスキップ"
            exit 0
          fi
          git commit -m "chore: 週次スクリーニング結果を更新 ($(date +%Y-%m-%d))"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then
              exit 0
            fi
            echo "push 失敗 (試行 $attempt)。5秒後に再試行"
            sleep 5
          done
          exit 1

      - name: Notify failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && { echo "SLACK_WEBHOOK_URL 未設定のため通知スキップ"; exit 0; }
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\": \":x: Weekly Screening が失敗しました: $RUN_URL\"}" "$SLACK_WEBHOOK_URL"
