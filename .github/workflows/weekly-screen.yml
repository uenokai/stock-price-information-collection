# 週次ファンダメンタル・スクリーニング
# 毎週土曜 07:00 JST (金曜 22:00 UTC) に全ユニバースをスクリーニングし、
# ウォッチリストとレポートをリポジトリにコミットする。
name: Weekly Screening

on:
  schedule:
    - cron: "0 22 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: screener-data
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      - name: Run screening
        run: stock-screener screen

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add data/watchlist.csv reports/
          if git diff --cached --quiet; then
            echo "変更なし: コミットをスキップ"
          else
            git commit -m "chore: 週次スクリーニング結果を更新 ($(date +%Y-%m-%d))"
            git push
          fi
